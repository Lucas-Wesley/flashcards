services:
  flashcards:
    # O app passa pelo Caddy (HTTPS, porta 8445). A página da TV (F37) fica direto no IP da VM, em HTTP:
    # o navegador da TV não aceita o nosso certificado.
    ports: !override
      - "192.168.1.20:8453:8081"
    volumes:
      - /srv/data/flashcards:/data
      # A conta do Claude escolhida no Hub (H11 do Hub), lida a cada chamada; só leitura.
      - /srv/data/claude/ativa:/claude:ro
    environment:
      # Avisos no celular (F35): o ntfy do homelab (homelab/ntfy), tópico "flashcards".
      NTFY_URL: http://ntfy/flashcards
      CLAUDE_TOKEN_ARQUIVO: /claude/token
      URL_DA_TV: http://192.168.1.20:8453
      # Falar o pedido à IA (F39): o Whisper large-v3 no Mac mini (homelab/whisper-mac) e, com o Mac
      # fora, o Whisper do servidor (o mesmo do Acervo).
      WHISPER_URL: http://192.168.1.160:8000
      WHISPER_RESERVA_URL: http://whisper:8000
    networks:
      - proxy

networks:
  proxy:
    external: true
