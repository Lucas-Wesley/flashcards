name: flashcards

services:
  flashcards:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: flashcards:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    # No servidor, a conta do Claude vem do Hub (tela Claude, H11 do Hub; ver compose.prod.yaml). No Mac,
    # CLAUDE_CODE_OAUTH_TOKEN (gerado com "claude setup-token") fica no .env, fora do Git.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
